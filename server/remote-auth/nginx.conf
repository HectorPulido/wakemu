limit_req_zone $binary_remote_addr zone=remote_login:10m rate=2r/s;
server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/remote.crt;
    ssl_certificate_key /etc/nginx/remote.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    # Do not log credentials or token query strings.
    access_log off;
    location ~ ^/(login|remember|game-token)$ {
        limit_except POST { deny all; }
        limit_req zone=remote_login burst=10 nodelay;
        proxy_pass http://world:18081;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
