name: wakfu-local
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:15432:5432'
    environment:
      POSTGRES_DB: wakemu_runtime
      POSTGRES_USER: wakemu
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Official PostgreSQL entrypoint restores only when the volume is empty.
      - ./database/docker/20-restore-runtime.sh:/docker-entrypoint-initdb.d/20-restore-runtime.sh:ro
      - ./database/backups:/bootstrap:ro
      - ./.database/secrets:/run/secrets:ro
    networks: [isolated, client-access]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U wakemu -d wakemu_runtime']
      interval: 5s
      timeout: 3s
      retries: 30
      # TCP readiness starts only after the entrypoint finishes initial restore.
      start_period: ${WAKFU_POSTGRES_START_PERIOD:-30m}
  world:
    image: ${WAKFU_WORLD_IMAGE:-wakemu-world:systems-20261011}
    build:
      context: ./server
      args:
        CATALOG_REVISION: ${WAKFU_CATALOG_REVISION:-bd79c10d0f29de7a32fa29f5d91439388de9ace3f8c2b9ed73f8314856667ae1}
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WAKFU_FISHING_CATALOG_REVISION: 20f2731c921701c025af2d8416696e5b01c7346fc9393408b47533c092cab5fa
      WAKFU_MINING_CATALOG_REVISION: 14b63a5b28014e455fd9910c99fe037e6d957ac9b40508335bfe130c2ee54518
      WAKFU_CATALOG_REVISION: ${WAKFU_CATALOG_REVISION:-bd79c10d0f29de7a32fa29f5d91439388de9ace3f8c2b9ed73f8314856667ae1}
      WAKFU_DATABASE_URL: host=postgres dbname=wakemu_runtime user=wakemu
      # Listen on the container network; published host ports stay localhost.
      WAKFU_BIND_HOST: ${WAKFU_BIND_HOST:-0.0.0.0}
      WAKFU_DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      WAKFU_AI_URL: ${WAKFU_AI_URL:-http://ai:8090}
      WAKFU_REDIS_URL: ${WAKFU_REDIS_URL:-redis://redis:6379/0}
      WAKFU_ECOLOGY_MODE: ${WAKFU_ECOLOGY_MODE:-external}
      WAKFU_OBJECTIVES_MODE: ${WAKFU_OBJECTIVES_MODE:-external}
      WAKFU_OBJECTIVES_PUBLIC_URL: ${WAKFU_OBJECTIVES_PUBLIC_URL:-http://127.0.0.1:18086/player/}
      WAKFU_ECOLOGY_TOKEN_FILE: /run/secrets/ecology-token
      #
      WAKFU_ALL_ZAAPS: ${WAKFU_ALL_ZAAPS:-1}
      WAKFU_ADVERTISE_HOST: ${WAKFU_ADVERTISE_HOST:-127.0.0.1}
      WAKFU_ADVERTISE_WORLD_PORT: ${WAKFU_ADVERTISE_WORLD_PORT:-15556}
      WAKFU_ALL_DRAGOS: ${WAKFU_ALL_DRAGOS:-1}
      WAKFU_OPEN_PLANTING: ${WAKFU_OPEN_PLANTING:-1}
      WAKFU_NATIVE_PLANTING_BONUS: ${WAKFU_NATIVE_PLANTING_BONUS:-0}
      WAKFU_PLANT_GROWTH_SECONDS: ${WAKFU_PLANT_GROWTH_SECONDS:-30}
      WAKFU_ENABLE_COMBAT_TEST: ${WAKFU_ENABLE_COMBAT_TEST:-1}
      WAKFU_COMBAT_START_EVENTS: ${WAKFU_COMBAT_START_EVENTS:-1}
      # Development fallback: omit unsupported equipment effects with chat/log diagnostics.
      WAKFU_DEV_SKIP_UNSUPPORTED_INITIALIZATION: ${WAKFU_DEV_SKIP_UNSUPPORTED_INITIALIZATION:-1}
      WAKFU_NATIVE_GRANTED_CAST: ${WAKFU_NATIVE_GRANTED_CAST:-1}
      WAKFU_NATIVE_AREA_CALLBACKS: ${WAKFU_NATIVE_AREA_CALLBACKS:-1}
      WAKFU_MAX_CHARACTERS: ${WAKFU_MAX_CHARACTERS:-18}
      WAKFU_COMBAT_TEST_GROUP_SIZE: ${WAKFU_COMBAT_TEST_GROUP_SIZE:-2}
      # Empty uses the native breed resource; a number is an explicit test override.
      WAKFU_COMBAT_TEST_WP: ${WAKFU_COMBAT_TEST_WP:-}
      WAKFU_COMBAT_ARENA_RADIUS: ${WAKFU_COMBAT_ARENA_RADIUS:-89}
      WAKFU_LOCAL_FIGHT_XP: ${WAKFU_LOCAL_FIGHT_XP:-0}
      WAKFU_LOCAL_FIGHT_KAMAS: ${WAKFU_LOCAL_FIGHT_KAMAS:-0}
      WAKFU_CLOCK_OFFSET_SECONDS: ${WAKFU_CLOCK_OFFSET_SECONDS:-0}
    ports:
      - "127.0.0.1:15556:15556"
      - "127.0.0.1:15558:15558"
      - "127.0.0.1:16337:16337"
      - "127.0.0.1:18081:18081"
    volumes:
      # Runtime code, protocol and migrations come from the validated image.
      # Source edits remain isolated until the next tested image is deployed.
      - ./.local-state/wakemu/world:/data
      - ./.database/secrets:/run/secrets:ro
      - ./server/ai-service:/app/ai-service:ro
    networks: [isolated, client-access]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 6m
  shop:
    image: ${WAKFU_SHOP_IMAGE:-wakemu-shop:performance-icons-20261011}
    build:
      context: ./server
      dockerfile: shop-service/Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WAKFU_DATABASE_URL: host=postgres dbname=wakemu_runtime user=wakemu
      WAKFU_DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      WAKFU_SHOP_PORT: '18083'
      WAKFU_REDIS_URL: redis://redis:6379/0
      SHOP_ASSETS_DIR: /shop-assets
      SHOP_PUBLIC_URL: http://127.0.0.1:18083
    volumes:
      - ./.database/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ./.database/shop-assets:/shop-assets:ro
    ports:
      - '127.0.0.1:18083:18083'
    networks: [isolated, client-access]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18083/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
  admin:
    image: ${WAKFU_ADMIN_IMAGE:-wakfu-local-admin:latest}
    build:
      context: ./server
      dockerfile: admin-service/Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WAKFU_DATABASE_URL: host=postgres dbname=wakemu_runtime user=wakemu
      WAKFU_DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      WAKFU_ADMIN_PORT: '18084'
      WAKFU_ADMIN_CREDENTIALS_FILE: /data/admin-credentials.json
      WAKFU_ADMIN_WORLD_TOKEN_FILE: /data/world-api-token
      WAKFU_ADMIN_CONTROL_URL: http://admin-control:18085
      WAKFU_ADMIN_CONTROL_TOKEN_FILE: /run/secrets/admin-control-token
      WAKFU_ADMIN_PROFILER_URL: http://profiler:8092
      WAKFU_ADMIN_PROFILER_REPORT: /metrics/performance-latest.json
      WAKFU_REDIS_URL: redis://redis:6379/0
      WAKFU_WORLD_URL: http://world:18081
      WAKFU_SHOP_URL: http://shop:18083
      WAKFU_OBJECTIVES_URL: http://objectives:8094
      WAKFU_OBJECTIVES_PUBLIC_URL: ${WAKFU_OBJECTIVES_PUBLIC_URL:-http://127.0.0.1:18086/player/}
      WAKFU_OBJECTIVES_TOKEN_FILE: /run/secrets/objectives-token
    volumes:
      - ./.database/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ./.database/secrets/admin:/data
      - ./.database/secrets/admin-control-token:/run/secrets/admin-control-token:ro
      - ./.local-state/wakemu/world/logs/profiles:/metrics:ro
      - ./.database/secrets/objectives-token:/run/secrets/objectives-token:ro
    ports:
      - '127.0.0.1:18084:18084'
    networks: [isolated, client-access]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18084/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
  admin-control:
    build:
      context: ./server
      dockerfile: admin-control-service/Dockerfile
    init: true
    environment:
      HOST_PROJECT_ROOT: ${PWD}
      WAKFU_COMPOSE_PROJECT: wakfu-local
      WAKFU_ADMIN_CONTROL_TOKEN_FILE: /run/secrets/admin-control-token
      WAKFU_DATABASE_URL: host=postgres dbname=wakemu_runtime user=wakemu
      WAKFU_DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      WAKFU_REDIS_URL: redis://redis:6379/0
      WAKFU_POSTGRES_TEST_URL: host=postgres dbname=wakemu_migration_test user=wakemu
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server:${PWD}/server:ro
      - ./compose.yaml:${PWD}/compose.yaml:ro
      - ./.env:${PWD}/.env:ro
      - ./compose.profiler.yaml:${PWD}/compose.profiler.yaml:ro
      - ./.database/secrets/admin-control:/data
      - ./.database/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ./.database/secrets/admin-control-token:/run/secrets/admin-control-token:ro
    networks: [isolated]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /root/.docker:size=16m,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,pathlib; token=pathlib.Path('/run/secrets/admin-control-token').read_text().strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18085/services',headers={'Authorization':'Bearer '+token}),timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 3
      start_period: 30s
  ecology:
    image: ${WAKFU_ECOLOGY_IMAGE:-wakemu-ecology:systems-20261011}
    build:
      context: ./server
      dockerfile: ecology-service/Dockerfile
      args:
        CATALOG_REVISION: ${WAKFU_CATALOG_REVISION:-bd79c10d0f29de7a32fa29f5d91439388de9ace3f8c2b9ed73f8314856667ae1}
    user: "${WAKFU_SERVICE_UID:-1000}:${WAKFU_SERVICE_GID:-1000}"
    init: true
    depends_on:
      world:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WAKFU_CATALOG_REVISION: ${WAKFU_CATALOG_REVISION}
      WAKFU_FISHING_CATALOG_REVISION: 20f2731c921701c025af2d8416696e5b01c7346fc9393408b47533c092cab5fa
      WAKFU_MINING_CATALOG_REVISION: 14b63a5b28014e455fd9910c99fe037e6d957ac9b40508335bfe130c2ee54518
      WAKFU_DATABASE_URL: host=postgres dbname=wakemu_runtime user=wakemu
      WAKFU_DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      WAKFU_REDIS_URL: redis://redis:6379/0
      WAKFU_WORLD_URL: http://world:18081
      WAKFU_ECOLOGY_TOKEN_FILE: /run/secrets/ecology-token
      WAKFU_ECOLOGY_MAX_ATTEMPTS: ${WAKFU_ECOLOGY_MAX_ATTEMPTS:-3}
      WAKFU_RUNTIME: /data
      WAKFU_PLANT_GROWTH_SECONDS: ${WAKFU_PLANT_GROWTH_SECONDS:-30}
    volumes:
      - ./.database/secrets:/run/secrets:ro
    networks: [isolated]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /data:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 64
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request,pathlib; token=pathlib.Path('/run/secrets/ecology-token').read_text().strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8093/health',headers={'Authorization':'Bearer '+token}),timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
  objectives:
    image: ${WAKFU_OBJECTIVES_IMAGE:-wakemu-objectives:local}
    build:
      context: ./server
      dockerfile: objectives-service/Dockerfile
      args:
        CATALOG_REVISION: ${WAKFU_CATALOG_REVISION}
    init: true
    depends_on:
      world:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      WAKFU_DATABASE_URL: host=postgres dbname=wakemu_runtime user=wakemu
      WAKFU_DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      WAKFU_OBJECTIVES_TOKEN_FILE: /run/secrets/objectives-token
      WAKFU_OBJECTIVES_PORT: '8094'
      WAKFU_OBJECTIVES_PUBLIC_URL: ${WAKFU_OBJECTIVES_PUBLIC_URL:-http://127.0.0.1:18086/player/}
      WAKFU_OBJECTIVES_EMBED_ORIGINS: ${WAKFU_OBJECTIVES_EMBED_ORIGINS:-http://127.0.0.1:18083,http://127.0.0.1:18084,http://127.0.0.1:18086,http://localhost:18086}
    volumes:
      - ./.database/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ./.database/secrets/objectives-token:/run/secrets/objectives-token:ro
    ports:
      - '127.0.0.1:18086:8094'
    networks: [isolated, client-access]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request,pathlib; token=pathlib.Path('/run/secrets/objectives-token').read_text().strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8094/health',headers={'Authorization':'Bearer '+token}),timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  ai:
    image: ${WAKFU_AI_IMAGE:-wakfu-local-ai:latest}
    build:
      context: ./server/ai-service
      args:
        WORLD_IMAGE: ${WAKFU_WORLD_IMAGE:-wakemu-world:systems-20261011}
        CATALOG_REVISION: ${WAKFU_CATALOG_REVISION:-bd79c10d0f29de7a32fa29f5d91439388de9ace3f8c2b9ed73f8314856667ae1}
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WAKFU_CATALOG_REVISION: ${WAKFU_CATALOG_REVISION}
      WAKFU_DATABASE_URL: host=postgres dbname=wakemu_runtime user=wakemu
      WAKFU_DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      WAKFU_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.database/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ai-context-data:/var/lib/wakfu-ai-context
    networks: [isolated]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 180s
  redis:
    image: redis:7-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --save, '']
    volumes:
      - redis-data:/data
    networks: [isolated]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 10
volumes:
  postgres-data:
  redis-data:
  ai-context-data:
networks:
  client-access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
  isolated:
    internal: true
