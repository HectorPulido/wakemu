services:
  profiler:
    profiles: [observability]
    image: ${WAKFU_PROFILER_IMAGE:-wakemu-profiler:local}
    build: ./server/profiler-service
    environment:
      PROFILER_RETENTION_SECONDS: ${WAKFU_PROFILER_RETENTION_SECONDS:-28800}
      PROFILER_MAX_BYTES: ${WAKFU_PROFILER_MAX_BYTES:-1073741824}
    restart: unless-stopped
    init: true
    pid: service:world
    depends_on:
      world:
        condition: service_healthy
        restart: true
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./.local-state/wakemu/profiler:/profiles
      - ./.local-state/wakemu/world/logs/profiles:/metrics:ro
    ports:
      - '127.0.0.1:18082:8092'
    networks: [isolated, client-access]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
